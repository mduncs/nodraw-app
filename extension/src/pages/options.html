<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>nodraw Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 24px;
      min-width: 320px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }
    input[type="number"] {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 6px 10px;
      width: 100px;
    }
    input:focus { outline: none; border-color: #e88a3a; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: #e88a3a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #d47a2a; }
    button.secondary {
      background: #333;
      color: #ccc;
    }
    button.secondary:hover { background: #444; }
    .status {
      font-size: 12px;
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      display: none;
    }
    .status.ok { display: block; background: #1a3a1a; color: #6c6; }
    .status.err { display: block; background: #3a1a1a; color: #c66; }
    .status.info { display: block; background: #1a2a3a; color: #6ac; }
    .discovery-info {
      font-size: 12px;
      color: #777;
      margin-bottom: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>nodraw — Server Connection</h2>

  <div class="discovery-info" id="discovery-info">Checking discovery service...</div>

  <div class="field">
    <label for="port">Manual port override (leave blank for auto-discovery)</label>
    <div class="row">
      <input type="number" id="port" min="1024" max="65535" placeholder="auto">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test Connection</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
